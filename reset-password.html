<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — 123 Раковая</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4;">

    <div class="admin-container" style="max-width: 400px; width: 100%; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #3e2723;">Новый пароль</h2>
        <form id="resetForm">
            <div class="form-group">
                <label>Введите новый пароль</label>
                <input type="password" id="newPassword" required placeholder="Минимум 5 символов" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <button type="submit" class="btn" id="submitBtn" style="width: 100%; padding: 12px; background: #d84315; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;">Сохранить</button>
            <p id="error-msg" style="text-align: center; margin-top: 10px; font-size: 14px;"></p>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const errorMsg = document.getElementById('error-msg');

        if (!token) {
            errorMsg.style.color = 'red';
            errorMsg.textContent = 'Ошибка: отсутствует токен. Перейдите по ссылке из письма.';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'Сохранение...';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (data.success) {
                    errorMsg.style.color = 'green';
                    errorMsg.textContent = 'Пароль изменен! Перенаправляем...';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    errorMsg.style.color = 'red';
                    errorMsg.textContent = data.error;
                    btn.disabled = false;
                    btn.textContent = 'Сохранить';
                }
            } catch (err) {
                errorMsg.style.color = 'red';
                errorMsg.textContent = 'Ошибка сервера';
                btn.disabled = false;
                btn.textContent = 'Сохранить';
            }
        });
    </script>
</body>
</html>
